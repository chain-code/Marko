name: Release

# 推版本号标签（如 2.0.0）时发布（R 章）：三个平台各自用 electron-builder 打包，安装包、校验文件、
# 自动更新用的 latest*.yml 和 blockmap 一起放进 GitHub Release，说明取 .github/release-notes/<版本>.md
on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          root=$(node -p "require('./package.json').version")
          if [[ "${version}" != "${root}" ]]; then
            echo "apps/desktop 的版本 ${version} 和根目录的 ${root} 不一致" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${version}" != "${GITHUB_REF_NAME}" ]]; then
              echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致" >&2
              exit 1
            fi
            if [[ ! -f ".github/release-notes/${version}.md" ]]; then
              echo "缺少发布说明 .github/release-notes/${version}.md" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            target: --win
          - os: macos-14
            artifact: macos-arm64
            target: --mac
          - os: ubuntu-22.04
            artifact: linux-x64
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 各平台的原生模块（@parcel/watcher）、ripgrep 由 npm 按当前平台装上
      - run: npm ci
      - name: 打包
        working-directory: apps/desktop
        env:
          # macOS 签名和公证：配了这几个 secret 才做；没配时出没有签名的包（electron-builder 做 ad-hoc 签名）
          CSC_LINK: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.os == 'macos-14' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.os == 'macos-14' && secrets.APPLE_TEAM_ID || '' }}
        # 构建（含主进程产物的检查）后打包；发布由下面的 publish 统一做
        run: npm run dist -- ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.sha256
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs:
      - verify-version
      - build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cp LICENSE release-assets/LICENSE
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Marko ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag

name: Release

# 推版本号标签（如 2.0.0）时发布（R 章）：三个平台各自用 electron-builder 打包，安装包、校验文件、
# 自动更新用的 latest*.yml 和 blockmap 一起放进 GitHub Release，说明取 .github/release-notes/<版本>.md。
# 改了打包的配置推到 main 时只打包、检查，不发布：macOS、Linux 的打包平时没有别的地方跑
on:
  push:
    tags:
      - "*.*.*"
    branches:
      - main
    # 只对推到 main 起作用（推标签时不看 paths）
    paths:
      - .github/workflows/release.yml
      - .github/scripts/**
      - apps/desktop/electron-builder.yml
      - apps/desktop/build/**
      - apps/desktop/package.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          root=$(node -p "require('./package.json').version")
          if [[ "${version}" != "${root}" ]]; then
            echo "apps/desktop 的版本 ${version} 和根目录的 ${root} 不一致" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if [[ "${version}" != "${GITHUB_REF_NAME}" ]]; then
              echo "标签 ${GITHUB_REF_NAME} 与 package.json 版本 ${version} 不一致" >&2
              exit 1
            fi
            if [[ ! -f ".github/release-notes/${version}.md" ]]; then
              echo "缺少发布说明 .github/release-notes/${version}.md" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
            target: --win
          # 要 Apple Silicon 的机器：npm 只装本机架构的原生子包（electron-builder.yml 拷的是 darwin-arm64 的）。
          # 不写死版本：旧的 macOS 镜像会下线（macos-14 在 2026-11 下线），macos-latest 一直指向最新的 arm64 镜像
          - os: macos-latest
            artifact: macos-arm64
            target: --mac
          - os: ubuntu-22.04
            artifact: linux-x64
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 各平台的原生模块（@parcel/watcher）、ripgrep 由 npm 按当前平台装上
      - run: npm ci
      # 构建（含主进程产物的检查）后打包；发布由下面的 publish 统一做
      - name: 打包
        working-directory: apps/desktop
        shell: bash
        env:
          # macOS 的签名证书、公证账号，只给 macOS 的任务；没配的 secret 是空字符串
          MAC_CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          MAC_CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          MAC_APPLE_ID: ${{ runner.os == 'macOS' && secrets.APPLE_ID || '' }}
          MAC_APPLE_APP_SPECIFIC_PASSWORD: ${{ runner.os == 'macOS' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          MAC_APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          args=(${{ matrix.target }})
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            if [[ -n "${MAC_CSC_LINK}" ]]; then
              # 有证书：签名；再配了 Apple ID 就公证。CSC_LINK 不能设成空字符串：electron-builder 会把它当成证书的路径（解析成当前目录，报 not a file）
              export CSC_LINK="${MAC_CSC_LINK}" CSC_KEY_PASSWORD="${MAC_CSC_KEY_PASSWORD}"
              if [[ -n "${MAC_APPLE_ID}" ]]; then
                export APPLE_ID="${MAC_APPLE_ID}" APPLE_APP_SPECIFIC_PASSWORD="${MAC_APPLE_APP_SPECIFIC_PASSWORD}" APPLE_TEAM_ID="${MAC_APPLE_TEAM_ID}"
              fi
            else
              # 没有证书：ad-hoc 签名。electron-builder 找不到证书时整个跳过签名，而改 Fuses 改了二进制、原来的签名就失效了，
              # Apple Silicon 上签名无效的程序打不开。ad-hoc 签名没有 Team ID，hardened runtime 的库校验会拒绝加载 Electron 的框架，所以不开
              args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            fi
          fi
          log="${RUNNER_TEMP}/dist.log"
          if ! npm run dist -- "${args[@]}" 2>&1 | tee "${log}"; then
            node ../../.github/scripts/annotate-tail.mjs "${log}" "打包失败（${RUNNER_OS}）"
            exit 1
          fi
      # 这个平台的安装包、更新用的 yml 都在，每个安装包有校验文件；macOS 上再校验整个 .app 的签名
      - name: 检查产物
        working-directory: apps/desktop/release
        shell: bash
        run: |
          case "${RUNNER_OS}" in
            Windows) patterns=("*-setup.exe" "latest.yml") ;;
            macOS) patterns=("*.dmg" "*-mac.zip" "latest-mac.yml") ;;
            Linux) patterns=("*.AppImage" "*.deb" "latest-linux.yml") ;;
          esac
          for pattern in "${patterns[@]}"; do
            if ! compgen -G "${pattern}" > /dev/null; then
              echo "::error title=缺少产物（${RUNNER_OS}）::release 目录里没有 ${pattern}"
              exit 1
            fi
          done
          for file in *.exe *.dmg *.zip *.AppImage *.deb; do
            if [[ -e "${file}" && ! -f "${file}.sha256" ]]; then
              echo "::error title=缺少校验文件（${RUNNER_OS}）::${file}.sha256"
              exit 1
            fi
          done
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            log="${RUNNER_TEMP}/codesign.log"
            if ! codesign --verify --deep --strict --verbose=2 mac-arm64/Marko.app > "${log}" 2>&1; then
              node ../../../.github/scripts/annotate-tail.mjs "${log}" "macOS 签名校验失败"
              exit 1
            fi
            # 签名的种类（adhoc 还是证书）、Team ID、hardened runtime 写成提示
            codesign --display --verbose=2 mac-arm64/Marko.app > "${log}" 2>&1
            node ../../../.github/scripts/annotate-tail.mjs "${log}" "macOS 签名" notice
          fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.sha256
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  publish:
    needs:
      - verify-version
      - build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cp LICENSE release-assets/LICENSE
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Marko ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag

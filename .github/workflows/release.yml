name: Release

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${version}" != "${tag}" ]]; then
            echo "标签 ${tag} 与 package.json 版本 ${version} 不一致" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

  build-windows:
    needs: verify-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: npm ci
      - run: npm run pack:win
      - name: 准备 Windows 发布资源
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $installer = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "未找到 Windows NSIS 安装包" }
          Copy-Item $installer.FullName release-assets/
          $target = Join-Path "release-assets" $installer.Name
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content "$target.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/*
          if-no-files-found: error

  build-macos-arm:
    needs: verify-version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run pack:mac-arm
      - name: 准备 macOS ARM64 发布资源
        shell: bash
        run: |
          mkdir -p release-assets
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)
          app=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)
          test -n "${dmg}" || { echo "未找到 macOS DMG" >&2; exit 1; }
          test -n "${app}" || { echo "未找到 macOS 应用包" >&2; exit 1; }
          dmg_name="Marko_${{ needs.verify-version.outputs.version }}_aarch64.dmg"
          app_name="Marko_${{ needs.verify-version.outputs.version }}_aarch64.app.zip"
          cp "${dmg}" "release-assets/${dmg_name}"
          ditto -c -k --sequesterRsrc --keepParent "${app}" "release-assets/${app_name}"
          cd release-assets
          shasum -a 256 "${dmg_name}" > "${dmg_name}.sha256"
          shasum -a 256 "${app_name}" > "${app_name}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs:
      - verify-version
      - build-windows
      - build-macos-arm
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - run: cp LICENSE release-assets/LICENSE
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "Marko ${GITHUB_REF_NAME}" \
            --notes-file ".github/release-notes/${GITHUB_REF_NAME}.md" \
            --verify-tag
